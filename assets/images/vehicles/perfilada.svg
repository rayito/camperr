<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <style>
    /* Clase principal para cambiar el color dinámicamente */
    .cuerpo-autocaravana {
      fill: #e2e8f0; /* Color base (blanco/gris claro) */
      stroke: #1e293b;
      stroke-width: 3;
      stroke-linejoin: round;
      transition: fill 0.3s ease;
    }

    /* Estilos secundarios para el resto de elementos */
    .ventanas {
      fill: #38bdf8;
      stroke: #1e293b;
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    .detalles-oscuros {
      fill: #334155;
      stroke: #1e293b;
      stroke-width: 2;
    }
    .franja-decorativa {
      fill: #f97316;
    }
    .neumatico {
      fill: #1e293b;
    }
    .llanta {
      fill: #cbd5e1;
      stroke: #1e293b;
      stroke-width: 2;
    }
    .luz {
      fill: #fde047;
      stroke: #1e293b;
      stroke-width: 1.5;
    }
  </style>

  
  <ellipse cx="160" cy="144" rx="145" ry="6" fill="#000000" opacity="0.15" />

  
  <path class="cuerpo-autocaravana" d="
    M 25 128
    L 25 45
    Q 25 30 40 30
    L 195 30
    Q 225 30 238 55
    L 246 72
    L 285 78
    Q 298 81 298 95
    L 298 122
    Q 298 128 290 128
    L 272 128
    A 22 22 0 0 0 228 128
    L 112 128
    A 22 22 0 0 0 68 128
    Z
  " />

  
  <path class="franja-decorativa" d="M 26.5 92 L 220 92 L 210 100 L 26.5 100 Z" />

  
  <rect class="detalles-oscuros" x="75" y="23" width="45" height="7" rx="3" />

  
  <rect class="ventanas" x="45" y="48" width="45" height="28" rx="5" />
  <rect class="ventanas" x="155" y="48" width="40" height="28" rx="5" />

  
  <rect x="108" y="48" width="32" height="76" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <rect class="ventanas" x="114" y="54" width="20" height="22" rx="3" />
  <line x1="113" y1="88" x2="120" y2="88" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  
  <path class="ventanas" d="
    M 212 52
    L 232 52
    L 243 74
    L 212 74
    Z
  " />

  
  <rect class="detalles-oscuros" x="232" y="68" width="7" height="14" rx="2" />

  
  <path class="luz" d="M 290 95 L 297 96 L 297 107 L 290 107 Z" />
  <rect x="24" y="102" width="5" height="12" rx="1" fill="#ef4444" stroke="#1e293b" stroke-width="1.5" />

  
  <rect class="detalles-oscuros" x="20" y="120" width="14" height="10" rx="3" />
  <rect class="detalles-oscuros" x="285" y="120" width="16" height="10" rx="3" />

  
  <g transform="translate(90, 128)">
    <circle class="neumatico" cx="0" cy="0" r="18" />
    <circle class="llanta" cx="0" cy="0" r="9" />
    <circle cx="0" cy="0" r="3" fill="#1e293b" />
  </g>

  
  <g transform="translate(250, 128)">
    <circle class="neumatico" cx="0" cy="0" r="18" />
    <circle class="llanta" cx="0" cy="0" r="9" />
    <circle cx="0" cy="0" r="3" fill="#1e293b" />
  </g>
</svg>